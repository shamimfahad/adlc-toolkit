# .adlc/config.yml — Per-project configuration
# This file holds everything stack-specific. Skills read it at runtime.
# Replace every <placeholder> with a real value, or delete sections that don't apply.

project:
  name: <project-name>
  description: <one-line description>

# How REQ (and BUG) IDs are chosen. Matters most for teams: the default
# `sequential` scheme picks the next number by scanning the vault, so two people
# branching at the same time can both mint REQ-042 and collide at merge.
#
#   sequential  — (default) REQ-NNN, max existing +1. Fine solo; collides on teams.
#   prefixed    — REQ-<prefix>-NNN, numbered within your own prefix. Per-person
#                 namespace — no coordination, works offline. Set `prefix`.
#   ticket      — derive the ID from the tracker issue the REQ implements:
#                 `/spec #842` (or an issue URL) with `sources.issues` set yields
#                 REQ-842 (or the native key like PROJ-842 for Jira/Linear).
#                 Always unique — the tracker already guarantees it — recommended for teams. With no
#                 issue ref it falls back to `prefixed` (if `prefix` set) else
#                 `sequential`. The same scheme applies to BUG IDs in /bugfix.
req:
  id_scheme: sequential
  # prefix: <your-initials>   # used by `prefixed` (and as the ticket fallback)

# Where work records live on disk. Knowledge files (lessons, ADRs, concepts)
# are never partitioned — they're found by search, not by browsing.
#
#   none          — specs/REQ-042-slug/             (today's shape)
#   month-author  — specs/2026-08/sf/REQ-042-slug/  (sprints/ get the month only)
#
# Bucketing keeps `specs/` showing a month of work instead of a year of it.
# The month is the month the REQ was created, is always YYYY-MM, and never
# changes — archiving preserves it. Both shapes stay readable forever, so
# switching is safe and reversible; run `/config migrate` to move existing
# folders into buckets (gated, shows the move plan first).
layout:
  partition: none
  # author: <your-initials>   # falls back to req.prefix, then git user.name

# Git policy — how much git the assistant may run. The WHOLE pipeline respects
# this; /autopilot's autonomy.git (below) may lower it but never exceed it. Set by /init.
#
#   manual       — (default) the assistant never runs git writes. It drafts the
#                  commit message (commits-draft.md), PR body (pr-draft.md), and
#                  merge-checklist.md; you run every git command yourself.
#   commit       — the assistant may `git add` + `git commit` on the REQ's feature
#                  branch, after that phase's gate is approved, using the drafted
#                  message. You still push and open/merge the PR.
#   commit+push  — also `git push` the REQ's feature branch (fast-forward only).
#                  You still open and merge the PR.
#
# Rules that hold in EVERY mode (you can't turn these off): only the REQ's own feature branch;
# never commit/push to a `protect:` branch; never force-push, rebase, amend
# published commits, `reset --hard` away commits, delete branches, run
# `gh pr create` / `gh pr merge`, or use `--no-verify`. Read commands
# (status / diff / log / show) are always allowed.
git:
  mode: manual
  protect: [main, master, release/*]

stack:
  # Declare what's in use. Skills read these to decide what stack-specific
  # behavior to enable.
  languages: [<typescript|python|csharp|...>]
  frontends: [<react|vue|ios|android|...>]   # optional
  backends: [<node|dotnet|django|cloud-run|lambda|...>]   # optional
  databases: [<postgres|firestore|sqlserver|...>]   # optional

# Verification commands — the project's own gates, as commands the pipeline RUNS and
# QUOTES rather than rules it describes. Consumers: /implement (task-implementer's done
# report quotes each command's last line), /review step 0 (runs them before any reviewer
# is dispatched; a `halt_on` failure stops the phase — first failure escalates; passing
# output enters the packet as "Deterministic findings" so reviewers cite facts instead of
# re-deriving them), /analyze (reports what is configured and when it last ran green).
# Every key is optional. Omit the block and the pipeline falls back to what it infers
# from `stack:` (package.json scripts, *.sln, Makefile) and says so in the gate card.
# `scope` says what a command really checks: a per-file lint that does not type-check
# the project is `changed`; a full build is `project`. The implementer may claim
# "types pass" only from a `project`-scoped command. /init seeds this from `stack:`
# and marks every guess `# STATUS: needs verification`.
# verify:
#   format:
#     run: dotnet format --verify-no-changes
#     scope: project
#   lint:
#     run: npm run lint -- --max-warnings=0
#     scope: changed
#   typecheck:
#     run: dotnet build --no-restore -warnaserror
#     scope: project
#   test:
#     run: dotnet test --no-build
#     scope: project
#     run_changed: dotnet test --no-build --filter "FullyQualifiedName~{{area}}"   # optional narrower form for /implement
#   # Project-owned sensors — anything that prints findings and exits non-zero on failure.
#   # A lesson whose `Detectable` row is grep|lint|test graduates here; its file then says
#   # `Enforced by: verify.sensors: <name>` and it leaves the reflector's and the knowledge
#   # hook's read sets. The pipeline never installs anything to run one.
#   sensors:
#     - name: check-firestore-indexes
#       run: node scripts/sensors/check-firestore-indexes.mjs
#       enforces: [L-REQ-042-2]        # lesson / gotcha IDs this sensor owns (cross-checked by /analyze)
#   digest_lines: 20                   # lines per command kept in the review packet digest
#   halt_on: [typecheck, test]         # a failure here stops /review before dispatch; others become findings

# Review packet — what /review bundles for its reviewers. Every dispatched
# reviewer reads the packet in full, so each file you exclude is saved four or
# five times over. Excluded files never enter the packet; the manifest lists
# them as `<path> (+N/-M)` and a reviewer who needs one reads it directly.
# Put generated outputs here: API clients (NSwag/OpenAPI/Prisma), lockfiles,
# snapshots, minified bundles. /init seeds this from `stack:`.
review:
  packet:
    exclude:
      - "**/*.lock"
      - "**/package-lock.json"
      - "**/pnpm-lock.yaml"
      - "**/*.snap"
      # - "frontend/src/types/api/index.ts"   # generated API client

# User-facing repo documentation. These are the docs /wrapup's repo-doc sweep
# (step 1) checks for drift when a REQ changes documented behavior, and edits
# once you approve the list at the ship gate — DISTINCT from the .adlc/
# knowledge vault, which /wrapup also owns. List the paths (files or directories) that describe behavior to
# humans: READMEs, a docs site, API reference, changelogs. Globs allowed.
#
# Omit the block entirely and the sweep falls back to a default scan of
# `README*` at the repo root plus a `docs/` directory if one exists. Set `docs:
# []` to disable the repo-doc sweep for this project.
# docs:
#   - README.md
#   - docs/
#   - CHANGELOG.md

# UI/UX runtime review. When `stack.frontends` is set, /review dispatches the
# ui-reviewer if the change touches UI either directly (components/pages/views/
# styles/templates) OR indirectly — a back-end API the frontend consumes changed
# (renamed field, new error, changed shape), which can break a screen with no UI
# file touched. It starts the app and drives a browser to confirm the change
# renders, the flows work, the interaction states are right (disabled/loading/
# error/empty), and it matches the design. A change with no frontend, or a pure
# API with no frontend consumer, never triggers it. This block tells the reviewer
# how to run the app; omit it and the reviewer infers the dev script from
# package.json and notes the assumption.
#
# The browser mechanism auto-resolves, first that works: Claude in Chrome (richest
# — real browser, click-through flows) → headless Playwright/Puppeteer if installed
# → static review + a manual checklist for you. It never blocks the pipeline.
# Visual comparison reuses `sources.design` (a Figma reference) when present.
# ui:
#   dev_server: npm run dev     # command that serves the app
#   url: http://localhost:3000  # where it serves once up
#   routes:                     # optional — specific paths/flows to exercise;
#     - /                       #   inferred from the changed components if omitted
#     - /checkout
#   browser: auto               # auto (default) | chrome | headless | static
#   auth:                       # optional — app behind a login
#     login_url: /login         #   route with the login form
#     env_file: .adlc/ui-auth.env  # local dotenv: ADLC_UI_USER / ADLC_UI_PASS (+ extras).
#                               #   Per-developer, gitignored, test creds only — values
#                               #   never appear in reports, logs, or screenshots. The
#                               #   chrome tier usually needs none of this: it drives
#                               #   your real browser session, already signed in.

# External sources — where this project's requirements and designs live, so the
# pipeline can SEED an artifact from them instead of you retyping it. Optional:
# omit the block entirely and the pipeline runs fully self-contained, exactly as before.
# Set by /init.
#
# Two layers:
#   SERVICE   — which system holds the work (github | linear | jira | none for
#               issues; figma | none for design). A stable project fact; chosen
#               once at /init.
#   MECHANISM — HOW the skill connects at run time (tries these in order, first that works). The
#               skill auto-resolves, first that works wins:
#                 1. a dedicated CLI if installed + authed (`gh` for GitHub)
#                 2. an attached MCP server for that service
#                 3. a plain URL fetch when the reference is a full link
#                 4. none available → fall back to manual authoring (one-line notice)
#               Pin `mechanism:` only to override the auto order.
#
# Reads are safe and on by default for declared services. WRITES (posting a PR
# link, transitioning an issue) are OFF unless the service is listed in `write`,
# and even then every write is a drafted action surfaced at a gate — never a
# silent side effect. /autopilot's autonomy.sources ceiling is capped by this list,
# exactly as autonomy.git is capped by git.mode.
#
# Invocation once a service is set: `/spec #8`, `/bugfix #8`, `/proceed #8`, or a
# full issue URL. The same resolver serves /spec and /bugfix.
# sources:
#   issues:  github            # github | linear | jira | none
#   design:  figma             # figma | none   (used by /architect)
#   repo:    <owner/name>      # default repo for bare refs like `/spec #8`
#   write:   []                # services the pipeline may write back to (default: none)
#   mechanism: auto            # auto (default) | gh | mcp | url

# Isolation strategy for in-flight REQs. Determines whether /architect and
# /bugfix create an isolated git worktree per REQ or work directly on a
# feature branch in the user's current checkout.
#
#   auto      — default. Branch for single-REQ skills (/proceed, /bugfix);
#               worktree for /sprint (parallelism requires it) and for
#               cross-repo REQs (mode is forced regardless of this setting).
#   branch    — always use a branch on the current checkout. /sprint and
#               cross-repo REQs still escalate to worktree.
#   worktree  — always create an isolated worktree per REQ. Older default;
#               useful if your editor doesn't mind switching folders, or
#               prefer one-line aborts via `git worktree remove --force`.
#
# Trade-off: branch mode keeps your editor session intact across REQ start
# and abort, but requires a clean working tree at the start of each REQ.
# Worktree mode tolerates a dirty main checkout but each REQ start is a
# folder switch in your editor.
#
# `edits` — how much per-edit friction the implementer carries WITHIN a phase.
# The phase-boundary gates are unaffected either way; this only governs editing
# inside the REQ's blast radius (its worktree/branch and the files its tasks name).
#
#   confirm-out-of-scope  — (default) the implementer edits freely inside the
#                           REQ's blast radius, but STOPS and surfaces before
#                           touching anything at the edge: files no task named,
#                           new top-level dependencies, schema/migrations, or
#                           auth/security/secrets. "Smooth inside, hard stop at
#                           the line."
#   confirm-each          — every file write is surfaced for confirmation.
#                           Highest friction; use when you don't trust the
#                           isolation or are working without a worktree.
workflow:
  isolation: auto
  edits: confirm-out-of-scope

# Autonomy — used by /autopilot (the autonomous pipeline) and by /sprint's gate
# queue. /proceed ignores this block and always pauses at every gate.
#
# /sprint reads `gates` (plus escalation, the rework caps, confidence_floor,
# packet_max_bytes, hard_stops) to decide who clears each runner's gate:
#   manual   — you triage every gate yourself (sprint's default when this
#              block is absent)
#   assisted — every gate still comes to you, with the decision-maker's
#              recommendation and confidence attached
#   auto     — the decision-maker clears routine gates; you see only the
#              exceptions (hard-stops, critical/major findings, HALTs,
#              exhausted rework caps, blocked runners) and every REQ's
#              final review. Merges are yours in every mode.
#
# If this block is absent, /autopilot falls back to safe defaults (gates:
# assisted, git: read-only, escalation: cautious) and tells you it's doing so;
# /sprint falls back to manual. Uncomment and tune to opt into more autonomy.
#
# autonomy:
#   gates: auto              # manual | assisted | auto   (who clears each gate)
#   git: commit+push         # read-only | commit | commit+push
#                            #   the autonomous git ceiling for /autopilot. Capped by
#                            #   the top-level `git.mode` — it can lower it but
#                            #   never exceed it (git.mode: manual ⇒ /autopilot is
#                            #   read-only too). push is feature-branch +
#                            #   fast-forward only — never main, force, or rewrite
#   sources: read-only       # read-only | write
#                            #   the autonomous external-write ceiling for /autopilot.
#                            #   Capped by `sources.write` above — can lower it but
#                            #   never exceed it (empty sources.write ⇒ read-only).
#                            #   External writes always stop for your explicit OK (see below).
#   escalation: balanced     # cautious | balanced | aggressive  (decision-maker bias)
#   rework_cap_per_gate: 2   # max REWORK loops at one gate before forced HALT
#   rework_budget_total: 5   # max REWORK loops across the whole run
#   confidence_floor: 0.6    # any verdict below this confidence becomes HALT
#   packet_max_bytes: 24576  # cap on the gate packet sent to the decision-maker
#   hard_stops:              # categories that always HALT for the human
#     - auth
#     - security
#     - secrets
#     - payments
#     - data-migration
#     - public-api-contract
#     - irreversible
#     - external-write       # posting/transitioning issues or PRs on a connected service
#   notify:
#     on_halt: true          # ping when the run halts and needs you
#     on_complete: true      # ping when the final review is ready

# Repository layout. For single-repo projects, leave the `repos:` block out
# entirely — skills fall back to single-repo behavior.
# For multi-repo features, every repo that may originate a REQ gets its own
# .adlc/ vault and its own config.yml. Configs are mirror images of each
# other: each repo marks itself primary: true and lists the others as siblings.
repos:
  <this-repo-id>:
    primary: true
  # <sibling-id>:
  #   path: ../<sibling-folder>

# merge_order: default order when merging cross-repo REQs.
# Only used when more than one repo is touched.
# merge_order:
#   - <repo-id>
#   - <repo-id>

# Per-repo service metadata. Used by deploy-aware skills (none in this toolkit
# by default — Claude doesn't run deploys). Keep this block if you have
# external scripts that consume it; remove otherwise.
# services:
#   <repo-id>:
#     deploy_target: <name>
#     region: <region>

# Stack-specific deploy targets. Used only by skills that surface deploy
# checklists for *you* to run. Claude never deploys.
# deploy:
#   staging: <command-or-target>
#   production: <command-or-target>

# Optional: paths Claude should treat as read-only legacy code
# (legacy code the assistant may read but must never change).
# Read-only verification is allowed; writes never are.
# read_only_sources:
#   - D:/legacy/codebase
#   - D:/legacy/contracts

# Optional: paths Claude is forbidden from reading at all (secrets, prod data).
# forbidden_paths:
#   - .env.production
#   - secrets/
